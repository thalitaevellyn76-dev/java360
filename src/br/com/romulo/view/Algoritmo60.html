<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 4 - Java Script</title>
</head>
<body>

    <!--
       Desafio- 
       Elaborar um programa que leia o valor
       de um jantar.Calcule e informe
       o valor da taxa do garçom (10%)
       e o valor total a ser pago.
    
    -->
    
    <script>
      
      valor = Number(prompt("Qual foi o valor do jantar"))
      taxa = valor * 0.1
      total = valor + taxa
      alert("Valor do jantar: R$ " + valor.toFixed(2))
      alert("Taxa do garçom: R$ " + taxa.toFixed(2))
      alert("Total a ser pago: R$ " + total.toFixed(2))

    </script>
</body>
</html>
