<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algoritmo 62</title>
</head>
<body>
    <!--
    
      Algoritmo 62:Elaborar um programa que leia a duração de uma viagem em dias e horas.
          Calcule e informe a duração total da viagem em números de horas.
             "Quantos dias" 2 (dias)
             "Quantas horas" 5 (horas)
            "Total em Horas:"______p
    
    -->

    <script>
        const dias = Number(prompt("Quantos dias?"))
        const horas = Number(prompt("Quantas horas?"))
        const totalHoras = (dias * 24) + horas
        alert("Total em Horas: " + totalHoras)
    </script>
</body>
</html>
